name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match {expected!r}")
          PY

      - name: Install release tooling
        run: python -m pip install -e '.[test,release]'

      - name: Run tests
        run: python -m pytest -q

      - name: Verify committed catalog
        run: python scripts/verify_catalog.py

      - name: Run lint and formatting checks
        run: |
          ruff check .
          ruff format --check .

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata and README rendering
        run: python -m twine check dist/*

      - name: Verify sdist is self-contained
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$tmp"
          (
            cd "$tmp"/piper_onnx_voices-*
            python -m pytest -q
          )

      - name: Smoke-test built wheel
        shell: bash
        run: |
          venv="$(mktemp -d)/venv"
          python -m venv "$venv"
          "$venv/bin/pip" install --no-deps dist/*.whl
          "$venv/bin/piper-voices" \
            --catalog "$PWD/catalog/voices.json" \
            show et_EE-news-medium

      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
