name: refresh-catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: piper-voice-catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/refresh_catalog.py
      - run: python scripts/verify_catalog.py
      - name: Commit catalog change
        run: |
          if [ -z "$(git status --porcelain -- catalog/voices.json)" ]; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add catalog/voices.json
          git commit -m "chore: refresh Piper voice catalog"
          git push
