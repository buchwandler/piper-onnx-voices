<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Piper voice catalog</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 980px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin: 0.75rem 0;
      }
      input,
      select,
      button,
      a.button {
        font: inherit;
        padding: 0.65rem 0.75rem;
      }
      .artifacts {
        display: grid;
        gap: 0.6rem;
        margin-top: 1rem;
      }
      .artifact {
        border: 1px solid #8886;
        border-radius: 0.6rem;
        padding: 0.8rem;
      }
      .artifact a {
        word-break: break-all;
      }
      code {
        word-break: break-all;
      }
      #status {
        opacity: 0.8;
      }
      @media (max-width: 640px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Piper voice catalog</h1>
    <p>
      Select one upstream Piper voice and download its required
      <code>MODEL_CARD</code>, <code>.onnx</code>, and <code>.onnx.json</code>.
    </p>
    <p id="status">Loading catalog…</p>
    <div class="row">
      <input id="filter" placeholder="Filter by id, language, voice, quality" />
      <select id="voice"></select>
    </div>
    <section id="details" hidden>
      <h2 id="title"></h2>
      <div id="meta"></div>
      <div class="artifacts" id="artifacts"></div>
    </section>
    <script>
      const LOCAL_CATALOG = "../catalog/voices.json";
      const UPSTREAM =
        "https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json";
      let voices = {};

      function resolveUrl(path) {
        return `https://huggingface.co/rhasspy/piper-voices/resolve/main/${path
          .split("/")
          .map(encodeURIComponent)
          .join("/")}?download=true`;
      }
      function normalizeUpstream(raw) {
        const out = {};
        for (const [id, v] of Object.entries(raw)) {
          const paths = Object.keys(v.files || {});
          const modelCard = paths.find(
            (p) => p.endsWith("/MODEL_CARD") || p === "MODEL_CARD"
          );
          const config = paths.find((p) => p.endsWith(".onnx.json"));
          const model = paths.find(
            (p) => p.endsWith(".onnx") && !p.endsWith(".onnx.json")
          );
          if (!modelCard || !model || !config) continue;
          const artifact = (role, path) => ({
            role,
            path,
            filename: path.split("/").pop(),
            url: resolveUrl(path),
            size: v.files[path].size_bytes,
            md5: v.files[path].md5_digest,
          });
          out[id] = {
            ...v,
            id,
            artifacts: {
              model_card: artifact("model_card", modelCard),
              model: artifact("model", model),
              config: artifact("config", config),
            },
          };
        }
        return out;
      }
      async function loadCatalog() {
        try {
          const r = await fetch(LOCAL_CATALOG, { cache: "no-store" });
          if (!r.ok) throw new Error("local catalog unavailable");
          const catalog = await r.json();
          voices = catalog.voices;
          status.textContent = `${
            Object.keys(voices).length
          } voices · pinned revision ${catalog.source.revision.slice(0, 12)}`;
        } catch (_) {
          const r = await fetch(UPSTREAM, { cache: "no-store" });
          if (!r.ok)
            throw new Error(
              `Unable to load upstream catalog: HTTP ${r.status}`
            );
          voices = normalizeUpstream(await r.json());
          status.textContent = `${
            Object.keys(voices).length
          } voices · live upstream main`;
        }
        refill();
      }
      function matches(v, needle) {
        const haystack = [
          v.id,
          v.name,
          v.quality,
          v.language?.code,
          v.language?.family,
          v.language?.name_english,
          v.language?.country_english,
          ...(v.aliases || []),
        ]
          .join(" ")
          .toLowerCase();
        return haystack.includes(needle.toLowerCase());
      }
      function refill() {
        const needle = filter.value.trim();
        const ids = Object.keys(voices)
          .filter((id) => !needle || matches(voices[id], needle))
          .sort();
        voice.innerHTML = ids
          .map(
            (id) =>
              `<option value="${id
                .replaceAll("&", "&amp;")
                .replaceAll('"', "&quot;")}">${id}</option>`
          )
          .join("");
        if (ids.length) render(ids[0]);
        else details.hidden = true;
      }
      function humanBytes(n) {
        if (!Number.isFinite(n)) return "?";
        const units = ["B", "KB", "MB", "GB"];
        let i = 0,
          value = n;
        while (value >= 1000 && i < units.length - 1) {
          value /= 1000;
          i++;
        }
        return `${value.toFixed(i ? 1 : 0)} ${units[i]}`;
      }
      function render(id) {
        const v = voices[id];
        if (!v) return;
        details.hidden = false;
        title.textContent = v.id;
        meta.textContent = `${v.language?.name_english || v.language?.code} (${
          v.language?.code
        }) · ${v.quality} · ${v.num_speakers} speaker(s)`;
        artifacts.innerHTML = ["model_card", "model", "config"]
          .map((role) => {
            const a = v.artifacts[role];
            return `<div class="artifact"><strong>${role}</strong> · ${humanBytes(
              a.size
            )}<br><a href="${a.url}" download>${
              a.filename
            }</a><br><small>MD5 <code>${a.md5}</code></small></div>`;
          })
          .join("");
      }
      filter.addEventListener("input", refill);
      voice.addEventListener("change", () => render(voice.value));
      loadCatalog().catch((err) => (status.textContent = err.message));
    </script>
  </body>
</html>
